name: BD790i setting origin
on:
  push:
    branches:
      - feat/bd790i-setting-origin
  pull_request:
    paths:
      - 'WPF/BiosOrigin/**'
      - 'WPF/Resources/BiosLayouts/**'
      - 'WPF/Controls/TimingRow.*'
      - 'WPF/Export/**'
      - 'WPF/MainWindow.*'
      - 'WPF/ViewModels/MainViewModel.cs'
      - 'WPF/Settings/AppSettings.cs'
      - 'WPF/Windows/DebugDialog.*'
      - 'WPF/Updater.cs'
      - 'WPF/Windows/AboutDialog.*'
      - 'WPF/Windows/OptionsDialog.*'
      - 'WPF/ZenTimings.csproj'
      - 'tests/DrfxiOriginSmoke/**'
      - '.github/workflows/bd790i-origin.yml'
jobs:
  build-and-test:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build origin resolver smoke test
        shell: pwsh
        run: msbuild tests/DrfxiOriginSmoke/DrfxiOriginSmoke.csproj /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
      - name: Run origin resolver regression scenarios
        shell: pwsh
        run: '& .\tests\DrfxiOriginSmoke\bin\Release\DrfxiOriginSmoke.exe'
      - name: Verify read-only firmware API across first-party sources
        shell: pwsh
        run: |
          $files = @('WPF', 'Common', 'tests') |
            ForEach-Object { Get-ChildItem -Path $_ -Recurse -File -Filter '*.cs' }
          foreach ($file in $files) {
            if ((Get-Content -LiteralPath $file.FullName -Raw) -match 'SetFirmwareEnvironmentVariable(?:Ex)?(?:A|W)?') {
              throw "Forbidden firmware write API in $($file.FullName)"
            }
          }
      - name: Build full WPF application
        if: always()
        shell: pwsh
        # Development artifact: the built-in update check is compiled out (ZenTimingsUpdateCheck=disabled),
        # so this build never offers the official release. Builds without the property are unchanged.
        run: msbuild WPF/ZenTimings.sln /restore /p:Configuration=Release '/p:Platform=Any CPU' /p:ZenTimingsUpdateCheck=disabled /verbosity:minimal

      - name: Stage portable Windows build
        if: success()
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'WPF/bin/Release'
          $exe = Join-Path $release 'ZenTimings.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'The Release build did not produce ZenTimings.exe'
          }
          $stage = Join-Path $PWD 'dist/ZenTimings-Lenovo-M75n-DDR4-Windows'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -LiteralPath $release -Force |
            Where-Object { $_.Extension -notin @('.pdb', '.xml') } |
            Copy-Item -Destination $stage -Recurse -Force
          # The native InpOut binary is not committed to ZenStates-Core. The official
          # ZenTimings 142.713 distribution still bundles it. Fetch that exact release,
          # authenticate its entire archive by the upstream-published SHA-256 digest,
          # and extract ONLY the native DLL. Never execute an upstream binary in CI.
          $releaseZip = Join-Path $env:RUNNER_TEMP 'ZenTimings-v142.713-official.zip'
          $nativeDir = Join-Path $env:RUNNER_TEMP 'zentimings-official-native'
          $officialUrl = 'https://github.com/irusanov/ZenTimings/releases/download/v142.713/ZenTimings_v142.713.zip'
          $officialDigest = 'C49F5A4A66A2C438D8B2BDDFDE5338DF67AD8BED835A5F2E3AD421B21C4D76A0'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $officialUrl -OutFile $releaseZip -MaximumRetryCount 3 -RetryIntervalSec 5
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseZip).Hash
          if ($actualDigest -ne $officialDigest) {
            throw "Official ZenTimings archive hash mismatch: $actualDigest"
          }
          Expand-Archive -LiteralPath $releaseZip -DestinationPath $nativeDir -Force
          $nativeCandidates = @(Get-ChildItem -LiteralPath $nativeDir -Recurse -File -Filter 'inpoutx64.dll')
          if ($nativeCandidates.Count -ne 1) {
            throw "Expected exactly one inpoutx64.dll in official release, found $($nativeCandidates.Count)"
          }
          $legacyLicenseSource = Join-Path $PWD 'ZenStates-Core/External/InpOut/license.txt'
          if (-not (Test-Path -LiteralPath $legacyLicenseSource -PathType Leaf)) {
            throw 'InpOut license missing from pinned ZenStates-Core'
          }
          Copy-Item -LiteralPath $nativeCandidates[0].FullName -Destination (Join-Path $stage 'inpoutx64.dll') -Force
          Copy-Item -LiteralPath $legacyLicenseSource -Destination (Join-Path $stage 'InpOut.LICENSE.txt') -Force

          $binary = Join-Path $stage 'ZenTimings.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'Portable package does not contain ZenTimings.exe'
          }
          # The update-check marker is an AssemblyMetadata attribute; its strings are stored as UTF-8 in the blob heap.
          $exeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($binary))
          if (-not $exeText.Contains('ZenTimings.UpdateCheck')) {
            throw 'Development artifact must be built with /p:ZenTimingsUpdateCheck=disabled'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'ZenStates-Core.dll') -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $stage 'inpoutx64.dll') -PathType Leaf)) {
            throw 'Portable package is missing the managed or native I/O dependency'
          }
          $sourceCommit = (git rev-parse HEAD).Trim()
          @(
            'ZenTimings Lenovo M75n DDR4 setting-origin - development build'
            'PR: ${{ github.event.pull_request.html_url }}'
            "Git commit: $sourceCommit"
            'Configuration: Release, Any CPU, .NET Framework 4.7.2'
            'Not signed. Lenovo M33KT24A/M33KT32A/M33KT33A are IFR-derived, not hardware verified. Includes stacked ASRock and MSI work. Does not write UEFI variables.'
            'Built-in update check: disabled (custom build; never offers the official release).'
            'IMPORTANT: Includes the legacy InpOut native library for AOD/APOB reads.'
            'The native library may load a legacy kernel driver, which Windows 11 security can block.'
            'Do not disable Memory Integrity or Microsoft vulnerable driver protections to run it.'
            "ZenTimings.exe SHA256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash)"
            "inpoutx64.dll SHA256: $((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $stage 'inpoutx64.dll')).Hash)"
          ) | Set-Content -LiteralPath (Join-Path $stage 'BUILD-INFO.txt') -Encoding UTF8
          Write-Host 'Portable package contents:'
          Get-ChildItem -LiteralPath $stage -Recurse -File | Select-Object FullName,Length

      - name: Upload portable Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZenTimings-Lenovo-M75n-DDR4-Windows
          path: dist/ZenTimings-Lenovo-M75n-DDR4-Windows/
          if-no-files-found: error
          retention-days: 14
